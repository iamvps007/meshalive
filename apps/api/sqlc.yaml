version: "2"
sql:
  - engine: "postgresql"
    queries: "repository/queries"
    schema: "migrations"
    gen:
      go:
        package: "repository"
        out: "repository"
        sql_package: "database/sql"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type: "github.com/google/uuid.NullUUID"
