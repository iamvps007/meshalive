events { worker_connections 1024; }

http {

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Cross-Origin-Resource-Policy "cross-origin" always;

  proxy_connect_timeout 10s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;
  send_timeout          60s;

  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  real_ip_header CF-Connecting-IP;

  map $http_x_forwarded_proto $cf_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  # ── Redirect .in → .com ──────────────────────────────────────────
  server {
    listen 80;
    server_name meshalive.in www.meshalive.in app.meshalive.in;
    return 301 https://meshalive.com$request_uri;
  }

  # ── API ──────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name api.meshalive.in api.meshalive.com;

    if ($cf_proto = "http") {
      return 301 https://$host$request_uri;
    }

    proxy_intercept_errors on;
    error_page 502 503 504 = @api_error;
    location @api_error {
      default_type application/json;
      return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Service temporarily unavailable"}}';
    }

    location / {
      proxy_pass http://api:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $cf_proto;
    }
  }

  # ── Main site ─────────────────────────────────────────────────────
  # ── Redirect www → root domain ─────────────────────────────────
  server {
    listen 80;
    server_name www.meshalive.com;
    return 301 https://meshalive.com$request_uri;
  }

  # ── Main site ─────────────────────────────────────────────────────
  server {
    listen 80;
    server_name meshalive.com;

    # Force HTTPS for all web visitors
    if ($cf_proto = "http") {
      return 301 https://$host$request_uri;
    }

    proxy_intercept_errors on;
    error_page 502 503 504 = @web_error;
    location @web_error { return 302 /not-found; }

    # Security
    location ~* /\.git { return 404; }
    location ~* /\.env { return 404; }
    location ^~ /api/  { return 404; }

    # Static assets
    # Static assets & aggressive caching (Max TTL)
    location ~* \.(ico|png|webp|avif|jpg|jpeg|svg|woff2)$ {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $cf_proto;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /_next/ {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $cf_proto;
      proxy_http_version 1.1;
    }

    # Normalize trailing slashes on all incoming URLs so Next.js never issues 308 redirects
    rewrite ^/(.+)/$ /$1 last;

    # Known multi-segment Next.js prefixes without trailing-slash lock
    location ^~ /p         { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $cf_proto; proxy_http_version 1.1; }
    location ^~ /tools     { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $cf_proto; proxy_http_version 1.1; }
    location ^~ /vs        { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $cf_proto; proxy_http_version 1.1; }
    location ^~ /blog      { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $cf_proto; proxy_http_version 1.1; }
    location ^~ /solutions { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $cf_proto; proxy_http_version 1.1; }

    # Known single-segment Next.js routes — MUST be before the slug regex
    location ~ ^/(login|register|dashboard|onboarding|pricing|about|blog|contact|docs|status|privacy|terms|refund|cookies|not-found|forgot-password|features|site-map|solutions|url-shortener|tools|vs|sitemap\.xml|robots\.txt|llms\.txt|favicon\.ico|og-image\.png)(/.*)?$ {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $cf_proto;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Short-link slugs → Go API (only after known routes are excluded)
    location ~ ^/[a-zA-Z0-9_-]+$ {
      rewrite ^/(.+)$ /r/$1 break;
      proxy_pass http://api:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $cf_proto;
      proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }

    # RFC 9727 API Catalog
    location = /.well-known/api-catalog {
      default_type "application/linkset+json; profile=\"https://www.rfc-editor.org/info/rfc9727\"";
      return 200 '{"linkset":[{"anchor":"https://meshalive.com/api","service-desc":[{"href":"https://meshalive.com/docs","type":"text/html"}],"service-doc":[{"href":"https://meshalive.com/docs","type":"text/html"}],"status":[{"href":"https://meshalive.com/status","type":"text/html"}]}]}';
    }

    # Everything else → Next.js
    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $cf_proto;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # ── msha.live ─────────────────────────────────────────────────────
  server {
    listen 80;
    server_name msha.live www.msha.live;

    location ~ ^/[a-zA-Z0-9_-]+$ {
      rewrite ^/(.+)$ /r/$1 break;
      proxy_pass http://api:8080;
      proxy_set_header Host meshalive.com;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $cf_proto;
      proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }

    location / {
      return 301 https://meshalive.com$request_uri;
    }
  }
}
