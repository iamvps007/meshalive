events { worker_connections 1024; }

http {

  # ─── Security headers ───────────────────────────────────────────────────────
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  proxy_connect_timeout 10s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;
  send_timeout          60s;

  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  real_ip_header CF-Connecting-IP;

  ssl_certificate     /etc/ssl/meshalive/selfsigned.crt;
  ssl_certificate_key /etc/ssl/meshalive/selfsigned.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;

  # ─── Redirect .in → .com ─────────────────────────────────────────────────
  server {
    listen 80;
    listen 443 ssl;
    server_name meshalive.in www.meshalive.in app.meshalive.in;
    return 301 https://meshalive.com$request_uri;
  }

  # ─── API (both .in and .com) ─────────────────────────────────────────────
  server {
    listen 80;
    listen 443 ssl;
    server_name api.meshalive.in api.meshalive.com;

    proxy_intercept_errors on;
    error_page 502 503 504 = @api_error;
    location @api_error {
      default_type application/json;
      return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Service temporarily unavailable"}}';
    }

    location / {
      proxy_pass http://api:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ─── HTTP → HTTPS redirect for meshalive.com ─────────────────────────────
  server {
    listen 80;
    server_name meshalive.com www.meshalive.com;
    return 301 https://meshalive.com$request_uri;
  }

  # ─── Main site: meshalive.com (HTTPS only) ────────────────────────────────
  server {
    listen 443 ssl;
    server_name meshalive.com www.meshalive.com;

    proxy_intercept_errors on;
    error_page 502 503 504 = @web_error;
    location @web_error {
      return 302 https://meshalive.com/not-found;
    }

    # Next.js static assets
    location ^~ /_next/ {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }

    # Bio pages — multi-segment /p/ paths
    location ^~ /p/ {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }

    # Tools pages
    location = /tools {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }

    location = /tools/ {
      proxy_pass http://web:3000/tools;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }

    location ^~ /tools/ {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }

    # Root
    location = / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Known marketing + app routes → Next.js
    location ~ ^/(pricing|about|blog|contact|docs|status|privacy|terms|refund|cookies|not-found|forgot-password|features|site-map|solutions|url-shortener|sitemap\.xml|robots\.txt|favicon\.ico|og-image\.png)(/|$) {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }

    location ~ ^/(login|register|dashboard|onboarding|api)(/|$) {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Short-link slugs: single-segment alphanumeric paths → Go API
    location ~ ^/[a-zA-Z0-9_-]+$ {
      rewrite ^/(.+)$ /r/$1 break;
      proxy_pass http://api:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }

    # Everything else → Next.js

    # Block sensitive path access
    location ~* /\.git { return 404; }
    location ~* /\.env { return 404; }

    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ─── msha.live — short link redirect domain ───────────────────────────────
  server {
    listen 80;
    listen 443 ssl;
    server_name msha.live www.msha.live;

    # Short-link slugs: pass Host as meshalive.com so API finds links by domain_id
    location ~ ^/[a-zA-Z0-9_-]+$ {
      rewrite ^/(.+)$ /r/$1 break;
      proxy_pass http://api:8080;
      proxy_set_header Host meshalive.com;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }

    # Everything else → redirect to main site
    location / {
      return 301 https://meshalive.com$request_uri;
    }
  }

}
